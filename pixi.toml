[workspace]
authors = ["Thibaut Modrzyk <52449813+Tmodrzyk@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "mu-bregman"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.9"

[activation.env]
PYTHONNOUSERSITE = "1"
MPLCONFIGDIR = "$PIXI_PROJECT_ROOT/.pixi/matplotlib"
DEEPINV_CACHE_DIR = "$PIXI_PROJECT_ROOT/.pixi/deepinv-cache"
CUDA_PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/default/targets/x86_64-linux"

[tasks]
test = "python -m unittest discover -s python/tests -v"
deconvolution-1 = "python python/notebooks/deconvolution-1.py"
deconvolution-2 = "python python/notebooks/deconvolution-2.py"
deconvolution-tv-stability = "python python/notebooks/deconvolution_tv_stability.py"
pet-2d = "python python/notebooks/pet2d.py"
pet-3d = "python python/notebooks/pet3d.py"
non-convexity = "python python/notebooks/non-convexity.py"

[dependencies]
python = "3.12.*"
parallelproj = ">=1.10,<2"
pytorch = ">=2.12.1,<3"
torchvision = ">=0.28.0,<0.29"
cuda-version = "12.9.*"
pytorch-gpu = ">=2.12.1,<3"
cupy = ">=14.1.1,<15"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.11.1,<4"
tqdm = ">=4.69.1,<5"
torchmetrics = ">=1.9.0,<2"
einops = ">=0.8.2,<0.9"
requests = ">=2.34.2,<3"
h5py = ">=3.16.0,<4"
natsort = ">=8.4.0,<9"
scipy = ">=1.16.3,<2"
kornia = ">=0.8.2,<0.9"
pywavelets = ">=1.9.0,<2"
numba = ">=0.66.0,<0.67"
timm = ">=1.0.28,<2"
diffusers = ">=0.39.0,<0.40"
transformers = ">=5.14.1,<6"
torchkbnufft = ">=1.4.0,<2"
array-api-compat = ">=1.15.0,<2"
sigpy = ">=0.1.27,<0.2"
datasets = ">=5.0.0,<6"
pandas = ">=3.0.3,<4"
nibabel = ">=5.4.2,<6"
rasterio = ">=1.5.0,<2"
pydicom = ">=3.0.2,<4"
libparallelproj = { version = ">=1.10,<2", build = "cuda*" }
seaborn = ">=0.13.2,<0.14"
ipykernel = ">=6.31,<7"

[pypi-dependencies]
bm3d = ">=4.0.1, <5"
bm4d = "<4.2.4"
libcpab = ">=0.1.3, <0.2"
ptwt = ">=1.0.1, <2"
spyrit = ">=3.0.0"
mat73 = ">=0.65, <0.66"
blosc2 = ">=4.9.1, <5"
deepinv = { git = "https://github.com/deepinv/deepinv.git", rev = "2328f67959dbfb40fae39bc4f215863a03da40a0" }
